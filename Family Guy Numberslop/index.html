<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Subterbaldi - Baldi's Basics</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #gameContainer {
            width: 100vw;
            height: 100vh;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
        }

        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            background:
                radial-gradient(circle at 50% 35%, #383838 0%, #171717 45%, #070707 100%);
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .loading-card {
            width: min(570px, calc(100vw - 40px));
            padding: 34px 36px 30px;
            box-sizing: border-box;
            text-align: center;
            background: rgba(15, 15, 15, 0.95);
            border: 3px solid #eee;
            box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.55);
        }

        .loading-title {
            margin: 0 0 5px;
            font-size: clamp(28px, 6vw, 48px);
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 3px 3px 0 #000;
        }

        .loading-subtitle {
            margin: 0 0 25px;
            color: #ccc;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .spinner {
            width: 42px;
            height: 42px;
            margin: 0 auto 20px;
            border: 5px solid #444;
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.85s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .progress-shell {
            width: 100%;
            height: 20px;
            margin: 0 auto 12px;
            background: #292929;
            border: 2px solid #777;
            box-sizing: border-box;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #f5f5f5;
            transition: width 0.15s ease;
        }

        #loadingText {
            margin: 0 0 24px;
            font-size: 16px;
            font-weight: bold;
        }

        .fact-box {
            min-height: 64px;
            padding: 12px 15px;
            box-sizing: border-box;
            background: #202020;
            border-left: 4px solid #fff;
            color: #dcdcdc;
            font-size: 13px;
            line-height: 1.45;
        }

        .fact-label {
            display: block;
            margin-bottom: 4px;
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1.5px;
        }

        @media (max-width: 500px) {
            .loading-card {
                padding: 27px 22px 23px;
            }
        }
    </style>
</head>

<body>

    <div id="loading">
        <div class="loading-card">
            <div class="spinner"></div>

            <h1 class="loading-title">SUBTERBALDI</h1>
            <p class="loading-subtitle">BALDI'S BASICS WEB EDITION</p>

            <div class="progress-shell">
                <div id="progressBar" class="progress-bar"></div>
            </div>

            <p id="loadingText">LOADING... 0%</p>

            <div class="fact-box">
                <span class="fact-label">DID YOU KNOW?</span>
                <span id="factText">
                    Baldi's Basics was originally made for the 2018 Meta Game Jam.
                </span>
            </div>
        </div>
    </div>

    <div id="gameContainer"></div>

    <script>
        // The build files are hosted in:
        // Baldi-Mod-Web-Ports/subterbaldi/Build/
        const BASE_URL =
            "https://brotataomc-boop.github.io/Baldi-Mod-Web-Ports/subterbaldi/";

        const BUILD_URL = BASE_URL + "Build/";

        const facts = [
            "Baldi's Basics was originally made for the 2018 Meta Game Jam.",
            "The game was designed as a parody of 1990s educational games.",
            "Notebooks are one of the most recognizable parts of Baldi's Basics.",
            "Baldi is a math teacher who really does not like getting answers wrong.",
            "The deliberately simple visuals are a big part of the game's strange style.",
            "Sometimes the best strategy is to run first and ask questions later."
        ];

        let factIndex = 0;

        function showNextFact() {
            const factText = document.getElementById("factText");

            if (factText) {
                factText.textContent = facts[factIndex];
            }

            factIndex = (factIndex + 1) % facts.length;
        }

        function setProgress(progress) {
            progress = Math.max(0, Math.min(1, progress));

            const bar = document.getElementById("progressBar");
            const text = document.getElementById("loadingText");

            if (bar) {
                bar.style.width = (progress * 100) + "%";
            }

            if (text) {
                text.textContent =
                    "LOADING... " +
                    Math.floor(progress * 100) +
                    "%";
            }
        }

        // UnityLoader uses this callback for WebGL loading progress.
        function UnityProgress(gameInstance, progress) {
            setProgress(progress);
        }

        showNextFact();
        setInterval(showNextFact, 4500);

        function startGame() {
            const script = document.createElement("script");

            script.src = BUILD_URL + "UnityLoader.js";

            script.onload = function() {
                try {
                    UnityLoader.instantiate(
                        "gameContainer",
                        BUILD_URL + "folder.json",
                        {
                            onProgress: UnityProgress
                        }
                    );

                    // Give Unity a moment to take over the page.
                    setTimeout(function() {
                        document.getElementById("loading")
                            .style.display = "none";
                    }, 1200);

                } catch (error) {
                    console.error(error);

                    document.getElementById("loadingText")
                        .textContent = "ERROR STARTING GAME";
                }
            };

            script.onerror = function() {
                document.getElementById("loadingText")
                    .textContent =
                    "ERROR LOADING UNITYLOADER.JS";
            };

            document.body.appendChild(script);
        }

        startGame();
    </script>

</body>
</html>
